[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYgeometry-mcp"
version = "0.1.0"
description = "Reference MCP adapter for the ANYgeometry automation protocol"
requires-python = ">=3.11"
dependencies = [
  "ANYgeometry>=0.4.1,<0.5",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anygeometry-mcp = "anygeometry_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["anygeometry_mcp*"]

[tool.pytest.ini_options]
pythonpath = ["src", "../ANYgeometry/src"]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
